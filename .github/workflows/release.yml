name: Release

on:
  # Manual only: pushes (including tag pushes) never start a release.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (next semver, e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The version is entered when the workflow is started by hand. A tag with
      # that exact name must already exist so the release points at real code.
      - name: Validate release version and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be vMAJOR.MINOR.PATCH (for example v0.2.0), got: $VERSION" >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION does not exist. Create and push it before starting this workflow." >&2
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build release binaries
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            local goos=$1 goarch=$2 ext=$3
            local out="dist/imgsync-${VERSION}-${goos}-${goarch}${ext}"
            echo "Building $out"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath \
              -ldflags "-s -w -X imgsync/internal/version.Version=${VERSION}" \
              -o "$out" .
          }
          build windows amd64 .exe
          build windows arm64 .exe
          build linux amd64 ''
          build linux arm64 ''
          build darwin amd64 ''
          build darwin arm64 ''
          (cd dist && sha256sum imgsync-* > "SHA256SUMS-${VERSION}.txt")

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The releases API rejects tag names as --target; it accepts a full
          # commit SHA. The tag was already checked above, so resolve it here.
          target_commit="$(git rev-parse "${VERSION}^{commit}")"
          gh release create "$VERSION" dist/* \
            --target "$target_commit" \
            --title "ImgSync $VERSION" \
            --generate-notes
